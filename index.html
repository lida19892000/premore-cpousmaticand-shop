<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premore Shop</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #fff; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card-img-wrapper img { width: 100%; height: 200px; object-fit: cover; border-radius: 5px; }
        .card-title { font-weight: bold; margin: 10px 0; }
        .price-container { margin: 10px 0; }
        .old-price { text-decoration: line-through; color: #888; margin-left: 8px; }
        .new-price { color: #e91e63; font-weight: bold; }
        .btn-whatsapp { display: inline-block; background: #25d366; color: white; text-decoration: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <div class="products-grid">
            
            <!-- Product 1 -->
            <div class="card">
                <div class="card-img-wrapper">
                    <!-- استبدل الرابط أدناه برابط صورتك المباشر من موقع رفع الصور -->
                    <img src="https://i.imgur.com/2nL191M.jpg" alt="Bobana Moroccan Soap">
                </div>
                <div class="card-body">
                    <div class="card-title">بوبانا المغربي بآيت الزيتون</div>
                    <div class="price-container">
                        <span class="old-price">90 ج.م</span>
                        <span class="new-price">65 ج.م</span>
                    </div>
                    <a href="https://wa.me/201203341917?text=أريد%20طلب%20منتج" class="btn-whatsapp">اطلب عبر الواتساب 🛒</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
